; OpenClash / subconverter 自定义订阅转换模板
; 用途：将订阅转换为 Clash/Mihomo 配置，并生成策略组与分流规则。
; 不在此文件中填写订阅链接、UUID、密码或其他节点凭据。
; 保存后将此文件的 Raw URL 填到 OpenClash → 订阅转换配置 → 自定义。

[custom]

; 重新生成规则，忽略机场订阅自带的规则
enable_rule_generator=true
overwrite_original_rules=true

; 可选：统一节点命名
rename_node=!!GROUPID=0!!(?i)(香港|\bHK\b|Hong Kong)@🇭🇰 香港
rename_node=!!GROUPID=0!!(?i)(台湾|台灣|\bTW\b|Taiwan)@🇹🇼 台湾
rename_node=!!GROUPID=0!!(?i)(日本|\bJP\b|Japan)@🇯🇵 日本
rename_node=!!GROUPID=0!!(?i)(新加坡|狮城|\bSG\b|Singapore)@🇸🇬 新加坡
rename_node=!!GROUPID=0!!(?i)(美国|美國|\bUS\b|United States)@🇺🇸 美国

; ==================== 规则：顺序与原 YAML 对应 ====================
; 说明：subconverter INI 不能读取 Mihomo 的 .mrs 规则集，以下换为可转换的文本规则。
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite.list
ruleset=🏠 私有网络,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=📲 电报消息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=📘 Meta 系,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Facebook/Facebook.list
ruleset=📘 Meta 系,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Instagram/Instagram.list
ruleset=🐦 推特/X,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list
ruleset=💬 其他社交,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
ruleset=🍏 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
ruleset=🍏 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/iCloud/iCloud.list

; APTV：使用你提供的 Surge 文本规则集，包含 DOMAIN-SUFFIX 与 IP-CIDR，
; 可被订阅转换后端直接处理。
ruleset=📺 APTV,https://raw.githubusercontent.com/marcuccilli/gary/refs/heads/main/iptv_surge.list
ruleset=📺 APTV,https://raw.githubusercontent.com/marcuccilli/Cathy/refs/heads/main/cathy_surge.list

; 国内域名与 IP 直连；其余非中国地区的常见服务走代理
ruleset=🔒 国内服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🔒 国内服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🔒 国内服务,[]GEOIP,CN
ruleset=🌍 非中国,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🐟 漏网之鱼,[]FINAL

; ==================== 策略组 ====================
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]DIRECT
custom_proxy_group=⚡ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`600,,40
custom_proxy_group=🛑 广告拦截`select`[]REJECT-DROP`[]REJECT
custom_proxy_group=📺 APTV`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT
custom_proxy_group=🤖 AI 服务`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=💬 其他社交`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🍏 苹果服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🐦 推特/X`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=📘 Meta 系`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🏠 私有网络`select`[]DIRECT
custom_proxy_group=🔒 国内服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🌍 非中国`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT
