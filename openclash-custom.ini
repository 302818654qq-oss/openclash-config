; OpenClash / subconverter 自定义订阅转换模板
; 用途：将订阅转换为 Clash/Mihomo 配置，并生成策略组与分流规则。
; 不在此文件中填写订阅链接、UUID、密码或其他节点凭据。
; 保存后将此文件的 Raw URL 填到 OpenClash → 订阅转换配置 → 自定义。

[custom]

; 重新生成规则，忽略机场订阅自带的规则
enable_rule_generator=true
overwrite_original_rules=true

; 可选：统一节点命名
rename_node=!!GROUPID=0!!(?i)(香港|\bHK\b|Hong Kong)@🇭🇰 香港
rename_node=!!GROUPID=0!!(?i)(台湾|台灣|\bTW\b|Taiwan)@🇹🇼 台湾
rename_node=!!GROUPID=0!!(?i)(日本|\bJP\b|Japan)@🇯🇵 日本
rename_node=!!GROUPID=0!!(?i)(韩国|韓國|\bKR\b|Korea)@🇰🇷 韩国
rename_node=!!GROUPID=0!!(?i)(美国|美國|\bUS\b|United States)@🇺🇸 美国

; 规则、DNS、Fake-IP 与嗅探已迁移至 OpenClash 覆写模块
; （见 openclash-mihomo-mrs-overwrite.conf）。此 INI 仅负责节点和策略组。

; ==================== 策略组 ====================
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇰🇷 韩国`[]🇺🇸 美国`[]DIRECT
custom_proxy_group=⚡ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`600,,40
; 兼容机场原配置或 OpenClash 附加规则中常见的“全球直连”引用
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT-DROP`[]REJECT
custom_proxy_group=📺 APTV`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT
custom_proxy_group=🤖 AI 服务`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=💬 其他社交`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🍏 苹果服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🐦 推特/X`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=📘 Meta 系`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🏠 私有网络`select`[]DIRECT
custom_proxy_group=🔒 国内服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🌍 非中国`select`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT

; ==================== 地区节点组 ====================
custom_proxy_group=🇭🇰 香港`url-test`(?i)(香港|\bHK\b|Hong Kong)`https://www.gstatic.com/generate_204`600,,40
custom_proxy_group=🇹🇼 台湾`url-test`(?i)(台湾|台灣|\bTW\b|Taiwan)`https://www.gstatic.com/generate_204`600,,40
custom_proxy_group=🇯🇵 日本`url-test`(?i)(日本|\bJP\b|Japan)`https://www.gstatic.com/generate_204`600,,40
custom_proxy_group=🇰🇷 韩国`url-test`(?i)(韩国|韓國|\bKR\b|Korea)`https://www.gstatic.com/generate_204`600,,40
custom_proxy_group=🇺🇸 美国`url-test`(?i)(美国|美國|\bUS\b|United States)`https://www.gstatic.com/generate_204`600,,40
